<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Choose New Password | Peak</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Choose a new password</h1>

      <p class="auth-subtitle">
        Enter your new Peak account password.
      </p>

      <form id="reset-password-form">
        <label for="password">
          New Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <label for="confirm-password">
          Confirm New Password
        </label>

        <input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <button
          class="primary-button"
          type="submit"
        >
          Reset Password
        </button>
      </form>

      <p id="reset-password-message"></p>

      <p class="auth-footer">
        <a href="/login.html">
          Back to login
        </a>
      </p>
    </section>
  </main>

  <script src="/reset-password.js"></script>
</body>
</html>
