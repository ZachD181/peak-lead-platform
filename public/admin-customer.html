<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Peak Customer Admin</title>

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>

  <main class="admin-page">

    <section class="admin-header">
      <div>
       <nav class="admin-nav">
  <a href="/" class="text-button">
    ← Main Peak Dashboard
  </a>

  <a href="/admin.html" class="text-button">
    Customers
  </a>
</nav>

        <p class="eyebrow">
          PEAK CUSTOMER ADMIN
        </p>

        <h1 id="customer-name">
          Loading customer...
        </h1>

        <p id="customer-industry"></p>
      </div>
    </section>


    <section class="admin-stats">

      <div class="metric-card">
        <span>Status</span>
        <strong id="customer-status">—</strong>
      </div>

      <div class="metric-card">
        <span>Plan</span>
        <strong id="customer-plan">—</strong>
      </div>

      <div class="metric-card">
        <span>Subscription</span>
        <strong id="customer-subscription">—</strong>
      </div>

    </section>


    <section class="admin-customers">

      <div class="section-heading">
        <p class="eyebrow">ACCOUNT</p>
        <h2>Company Details</h2>
      </div>

      <div id="customer-detail-message"></div>

      <div class="customer-card">
        <p>
          <strong>Slug:</strong>
          <span id="customer-slug">—</span>
        </p>

        <p>
          <strong>Customer ID:</strong>
          <span id="customer-id">—</span>
        </p>
      </div>

    </section>
    <section class="admin-customers">

  <div class="section-heading">
    <p class="eyebrow">USERS</p>
    <h2>Customer Team</h2>
  </div>

  <div
    id="customer-users"
    class="customer-list"
  >
    Loading users...
  </div>

</section>


<section class="admin-customers">

  <div class="section-heading">
    <p class="eyebrow">SCORING RULES</p>
    <h2>Lead Scoring Configuration</h2>
  </div>

 <form
  id="customer-scoring-form"
  class="customer-card"
>

  <div class="settings-group">
    <h3>Urgency</h3>

    <label>
      Immediately
      <input
        type="number"
        name="immediately"
        min="0"
        max="100"
      />
    </label>

    <label>
      Within 30 Days
      <input
        type="number"
        name="within30Days"
        min="0"
        max="100"
      />
    </label>

    <label>
      1-3 Months
      <input
        type="number"
        name="oneToThreeMonths"
        min="0"
        max="100"
      />
    </label>

    <label>
      3-6 Months
      <input
        type="number"
        name="threeToSixMonths"
        min="0"
        max="100"
      />
    </label>

    <label>
      Just Researching
      <input
        type="number"
        name="researching"
        min="0"
        max="100"
      />
    </label>
  </div>


  <div class="settings-group">
    <h3>Readiness</h3>

    <label>
      Ready to Buy
      <input
        type="number"
        name="readyToBuy"
        min="0"
        max="100"
      />
    </label>

    <label>
      Actively Comparing
      <input
        type="number"
        name="activelyComparing"
        min="0"
        max="100"
      />
    </label>

    <label>
      Getting Estimates
      <input
        type="number"
        name="gettingEstimates"
        min="0"
        max="100"
      />
    </label>

    <label>
      Early Research
      <input
        type="number"
        name="earlyResearch"
        min="0"
        max="100"
      />
    </label>
  </div>


  <div class="settings-group">
    <h3>Contact Signals</h3>

    <label>
      Phone Provided
      <input
        type="number"
        name="phone"
        min="0"
        max="100"
      />
    </label>

    <label>
      Notes Provided
      <input
        type="number"
        name="notes"
        min="0"
        max="100"
      />
    </label>
  </div>


  <div class="settings-group">
    <h3>Thresholds</h3>

    <label>
      High Priority
      <input
        type="number"
        name="highPriorityThreshold"
        min="0"
        max="100"
      />
    </label>

    <label>
      Qualified
      <input
        type="number"
        name="qualifiedThreshold"
        min="0"
        max="100"
      />
    </label>
  </div>

  <p id="scoring-save-status"></p>

  <button
    type="submit"
    class="primary-button"
  >
    Save Scoring Rules
  </button>

</form>

</section>

  </main>

  <script src="/admin-customer.js"></script>

</body>
</html>
