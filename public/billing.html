<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Upgrade Peak</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
     <h1 id="billing-title">
  Your Peak trial has ended
</h1>

 <p
  id="billing-subtitle"
  class="auth-subtitle"
>
  Choose a plan to continue scoring,
  managing, and following up with leads.
</p>   

      <button
        id="upgrade-button"
        class="primary-button"
        type="button"
      >
        Upgrade Peak
      </button>

      <button
        id="manage-subscription-button"
        class="primary-button"
        type="button"
      >
        Manage Subscription
      </button>

      <p id="billing-message"></p>

      <p class="auth-footer">
        <a href="/">Back to Peak</a>
      </p>
    </section>
  </main>

  <script src="/billing.js"></script>
</body>
</html>
