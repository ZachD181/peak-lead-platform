<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Forgot Password | Peak</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Reset your password</h1>

      <p class="auth-subtitle">
        Enter your account email and we'll create
        a secure password reset link.
      </p>

      <form id="forgot-password-form">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        />

        <button
          class="primary-button"
          type="submit"
        >
          Send Reset Link
        </button>
      </form>

      <p id="forgot-password-message"></p>

      <div
        id="test-reset-link"
        style="display: none;"
      ></div>

      <p class="auth-footer">
        <a href="/login.html">
          Back to login
        </a>
      </p>
    </section>
  </main>

  <script src="/forgot-password.js"></script>
</body>
</html>
