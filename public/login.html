<!doctype html>
<html lang="en">
<head>
  <script type="module" src="/analytics.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to your account | Peak Lead Platform</title>
  <meta name="description" content="Sign in to Peak Lead Platform to manage your business’s leads, team assignments, sales pipeline, and daily follow-up priorities." />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>

  <main class="auth-page">
  <section class="auth-card">

      

      <p class="eyebrow">SECURE CLIENT ACCESS</p>

      <h1>Sign in to Peak.</h1>

      <p class="login-copy">
        Access your leads, campaign performance,
        morning brief, and scoring settings.
      </p>

      <form id="login-form">

        <label>
          Email
          <input
            type="email"
            name="email"
            autocomplete="email"
            required
          />
        </label>

        <label>
          Password
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>

        <p class="auth-footer">
  <a href="/forgot-password.html">
    Forgot Password?
  </a>
</p>
        <button
          type="submit"
          class="primary-button"
        >
          Sign In
        </button>

        <p id="login-status"></p>

      </form>

    </section>

  </main>

  <script>
    const form = document.getElementById("login-form");
    const status = document.getElementById("login-status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      status.textContent = "Signing in...";

      const data = new FormData(form);

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            email: data.get("email"),
            password: data.get("password"),
          }),
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Unable to sign in."
          );
        }

       

        sessionStorage.setItem(
          "peak-user",
          JSON.stringify(result.user)
        );

        window.peakAnalytics?.setIdentity(result.user.id, { email: result.user.email, name: result.user.name });
        status.textContent = "Login successful.";

      if (result.user.role === "peak_admin") {
  window.location.href = "/admin.html";
} else {
  window.location.href = "/dashboard.html";
}
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>

</body>
</html>
